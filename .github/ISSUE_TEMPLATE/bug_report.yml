name: Bug report
description: Report a reproducible installation, runtime, or analysis problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use the affected project's tracker. Share public or synthetic examples and remove confidential data and credentials."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal input, commands, and steps. State if a reproducible example is unavailable.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include the OS, software and dependency versions, and project release or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Add relevant errors and approaches already tried. Remove sensitive information.
