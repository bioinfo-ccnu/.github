name: Questions and resources
description: Ask a question or suggest a research resource
title: "[Question] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Question
        - Resource suggestion
        - Collaboration
        - Organization profile
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain your question or suggestion. Include sources when sharing resources. Share only information suitable for public discussion.
    validations:
      required: true
