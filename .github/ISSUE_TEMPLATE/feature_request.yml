name: Feature request
description: Suggest a feature, workflow, or documentation improvement
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: What problem would this solve? What is difficult with the current approach?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and include examples or references.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and alternatives
      description: How would success be assessed? Are there alternatives or known limitations?
